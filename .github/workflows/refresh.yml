name: refresh-data
# 매주 월요일 03:00 KST: LOCALDATA·상권 영역 내려받기 → 가공 → Supabase 적재
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      gus:
        description: "구 이름(공백 구분). 비우면 서울 25개 구 전체"
        required: false
        default: ""
concurrency: refresh-data
permissions:
  contents: write   # 정적 페이지(docs/a, docs/g) 커밋
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Fetch
        run: python -I pipeline/fetch.py ${{ github.event.inputs.gus }}
      - name: Build
        run: python -I pipeline/build.py ${{ github.event.inputs.gus }}
      - name: Load
        env:
          JARI_DB_PASSWORD: ${{ secrets.JARI_DB_PASSWORD }}
          PSQL: psql
        run: bash pipeline/load.sh
      - name: Trend (서울시 상권분석 매출·인구, 새 분기만)
        env:
          JARI_DB_PASSWORD: ${{ secrets.JARI_DB_PASSWORD }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          PSQL: psql
        run: |
          HAVE=$(bash ./db.sh -tAc "select distinct q from area_q" | tr '\n' ' ')
          python -I pipeline/fetch_trend.py $HAVE
          bash pipeline/load_trend.sh
      - name: Academy (서울시 학원·교습소, 사라진 곳은 폐원 기록)
        env:
          JARI_DB_PASSWORD: ${{ secrets.JARI_DB_PASSWORD }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          PSQL: psql
        run: bash pipeline/load_academy.sh
      - name: Rent (한국부동산원 임대료·공실률, 분기)
        env:
          JARI_DB_PASSWORD: ${{ secrets.JARI_DB_PASSWORD }}
          RONE_KEY: ${{ secrets.RONE_KEY }}
          PSQL: psql
        run: bash pipeline/load_rent.sh
      - name: Pages (상권·구 정적 페이지, sitemap)
        env:
          JARI_DB_PASSWORD: ${{ secrets.JARI_DB_PASSWORD }}
          PSQL: psql
        run: |
          bash pipeline/build_pages.sh
          git config user.name "jari-bot"
          git config user.email "jari-bot@users.noreply.github.com"
          git add docs/a docs/g docs/list.html docs/sitemap.xml docs/p.css
          git diff --cached --quiet || { git commit -m "정적 페이지 갱신 $(date -u +%F)"; git push; }
