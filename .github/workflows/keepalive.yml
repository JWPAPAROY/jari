name: keepalive
# Supabase 무료 프로젝트는 7일간 활동이 없으면 멈춘다 → 매일 공개 읽기 한 번(주간 적재가 실패해도 안전)
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          set -a; . <(curl -fsS https://raw.githubusercontent.com/JWPAPAROY/jari/main/.env.public); set +a
          curl -fsS "$SUPABASE_URL/rest/v1/meta?select=key&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null && echo ok
