<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jari · 이 자리 몇 년 버텼나</title>
<meta name="description" content="서울 음식점·카페·미용실·의원·편의점 등 가게 인허가 기록으로 본 건물·상권별 1·2·3년 생존율과 업종별 차이">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 레이아웃: 위 검색줄 · 왼쪽 지도 · 오른쪽 결과 패널(모바일은 지도 아래). 인허가 대장 같은 차분한 톤 */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18232b; --muted:#5d6b75; --line:#d9e0e4;
  --accent:#1f5f7a; --accent-soft:#e2eef3;
  --risk:#b4342b; --risk-soft:#f7e3e1; --safe:#2c7a4b; --safe-soft:#e1f1e7; --mid:#8a6d1d;
  --c1:#c0392b; --c2:#e07b4f; --c3:#e9c46a; --c4:#7fb77e; --c5:#2c7a4b; --cna:#b8c2c8;
  --t1:#c0392b; --t2:#e8a089; --t3:#d5d9dc; --t4:#7aa7d6; --t5:#1f5fa8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11181d; --panel:#182229; --ink:#e4ebef; --muted:#93a3ad; --line:#2a3842;
  --accent:#6fb3cf; --accent-soft:#1d3440; --risk:#ec7a70; --risk-soft:#3a2120; --safe:#6cc58f; --safe-soft:#1b3326; --mid:#d6b45a; --cna:#4a5862; --t1:#e0675b; --t2:#9a5a4e; --t3:#56636c; --t4:#4f7fae; --t5:#7fb4ee; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 var(--f-body); display:flex; flex-direction:column}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
header{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right)); background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:1000}
.brand{font-weight:700; font-size:18px; letter-spacing:-.01em; white-space:nowrap}
.brand span{color:var(--muted); font-weight:400; font-size:13px; margin-left:6px}
.searchbox{position:relative; flex:1 1 280px; min-width:0}
.searchbox input{width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px}
.results{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:60vh; overflow:auto}
.results button{display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:9px 12px; font:inherit; color:var(--ink); cursor:pointer}
.results button:hover, .results button:focus-visible{background:var(--accent-soft); outline:none}
.results small{display:block; color:var(--muted); font-size:12px}
.chip{font-size:11px; padding:1px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent); margin-right:6px}
.ctl{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
select{font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 8px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{font:inherit; font-size:13px; background:var(--bg); color:var(--ink); border:0; padding:7px 10px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel)}
main{display:grid; grid-template-columns:minmax(0,1fr) 420px; flex:1; min-height:0}
#map{height:100%; min-height:300px; background:var(--bg); position:relative; z-index:0}
#sheet{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
#panel{overflow:auto; flex:1; min-height:0; padding:18px max(18px,env(safe-area-inset-right)) 40px 18px; overscroll-behavior:contain}
.grab{display:none}
@media (max-width:860px){
  html,body{height:100dvh; overflow:hidden}
  header{gap:8px; padding-top:max(8px,env(safe-area-inset-top)); padding-bottom:8px}
  .brand span{display:none}
  .searchbox{order:3; flex-basis:100%}
  .searchbox input{font-size:16px; padding:10px 12px}
  /* 한 줄: 이름 + 보기 / 둘째 줄: 업종 + 연차 / 셋째 줄: 검색 */
  .ctl{display:contents}
  #mode{margin-left:auto}
  #svc{order:1; flex:1 1 auto; min-width:0}
  #yrs{order:1}
  select{font-size:14px; padding:6px}
  .seg button{padding:6px 9px}
  main{display:block; position:relative}
  #map{position:absolute; inset:0; height:auto; min-height:0}
  /* 결과는 지도 위로 끌어 올리는 시트: 살짝(peek)·절반(half)·전체(full) */
  #sheet{position:absolute; left:0; right:0; bottom:0; height:50%; z-index:10; border-left:0; border-radius:14px 14px 0 0; box-shadow:0 -4px 18px rgba(0,0,0,.18); transition:height .22s ease}
  #sheet.drag{transition:none}
  .grab{display:flex; justify-content:center; align-items:center; height:26px; flex:none; cursor:grab; touch-action:none}
  .grab i{width:40px; height:5px; border-radius:3px; background:var(--line)}
  #panel{padding:2px max(16px,env(safe-area-inset-right)) calc(76px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .leaflet-bottom{bottom:var(--shpx, 0px)}
  h1{font-size:19px}
  .surv b{font-size:22px}
  .legend{font-size:11px; padding:6px 8px; line-height:1.35}
  .legend .note{display:none}
  .legend.closed .rows{display:none}
  .results{max-height:55vh}
}
@media (max-width:480px){
  .col-bar{display:none}
  th,td{padding:6px 4px}
  .surv{gap:6px}
  .surv div{padding:8px}
}
.addcmp{font:inherit; font-size:13px; margin-top:8px; background:var(--panel); color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:4px 12px; cursor:pointer}
.addcmp[aria-pressed="true"]{background:var(--accent); color:var(--panel)}
#cmpbar{position:fixed; left:max(14px,env(safe-area-inset-left)); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:1100; display:none; gap:6px; align-items:center;
  background:var(--ink); color:var(--panel); border-radius:999px; padding:6px 6px 6px 14px; box-shadow:0 4px 14px rgba(0,0,0,.25); font-size:13.5px}
#cmpbar.show{display:flex}
#cmpbar button{font:inherit; font-size:13px; border:0; border-radius:999px; padding:6px 12px; cursor:pointer}
#cmpbar .go{background:var(--accent); color:var(--panel); font-weight:700}
#cmpbar .clr{background:transparent; color:var(--panel); opacity:.75; padding:6px 8px}
table.cmp{table-layout:fixed; font-size:13px}
table.cmp th:first-child, table.cmp td:first-child{width:30%; color:var(--muted); font-size:12px; font-weight:400}
table.cmp thead th{color:var(--ink); font-size:13px; font-weight:700; vertical-align:top}
table.cmp td{vertical-align:top}
table.cmp tr.sec td{background:var(--bg); color:var(--ink); font-weight:700; font-size:12.5px; padding-top:8px}
table.cmp .best{color:var(--safe); font-weight:700}
table.cmp .worst{color:var(--risk)}
table.cmp small{display:block; color:var(--muted); font-size:11.5px; font-weight:400}
.rm{font:inherit; font-size:11.5px; background:none; border:0; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline}
.cmpsum{display:grid; gap:8px; margin-top:12px}
.cmpsum div{background:var(--bg); border-radius:8px; padding:9px 11px; font-size:13px}
@media (max-width:480px){ table.cmp{font-size:12px} table.cmp th:first-child, table.cmp td:first-child{width:26%} }
h1{font-size:20px; line-height:1.3; margin:0; text-wrap:balance}
h2{font-size:15px; margin:22px 0 8px}
.sub{color:var(--muted); font-size:13px; margin:2px 0 0}
.label{font-size:12px; letter-spacing:.05em; color:var(--muted)}
.surv{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.surv div{background:var(--bg); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:2px}
.surv b{font-family:var(--f-num); font-size:26px; line-height:1.1}
.surv small{color:var(--muted); font-size:12px}
.warn{font-size:12.5px; color:var(--mid); margin-top:8px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-weight:500; color:var(--muted); font-size:12px}
td.r,th.r{text-align:right}
tr.thin td{opacity:.45}
.bar{height:8px; border-radius:2px; background:var(--bg); position:relative; min-width:50px}
.bar i{position:absolute; inset:0 auto 0 0; border-radius:2px}
.tag{font-size:12px; padding:1px 7px; border-radius:4px; white-space:nowrap}
.tag.dead{background:var(--risk-soft); color:var(--risk)} .tag.live{background:var(--safe-soft); color:var(--safe)} .tag.old{background:var(--bg); color:var(--muted)}
.note{font-size:12.5px; color:var(--muted)}
.legend{background:var(--panel); color:var(--ink); padding:8px 10px; border-radius:8px; font-size:12px; line-height:1.5; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.legend i.dot{border-radius:50%; margin-right:4px; vertical-align:middle}
.legend .dotkey{margin-top:6px; padding-top:6px; border-top:1px solid var(--line)}
.legend .muted{color:var(--muted); font-size:11px}
.hint{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.hint button{font:inherit; font-size:13px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer}
.tblwrap{overflow-x:auto}
.leaflet-container{font-family:var(--f-body)}
.basemap{filter:grayscale(.85) contrast(.95) brightness(1.04)}
@media (prefers-color-scheme: dark){ .basemap{filter:grayscale(1) invert(.9) brightness(.85) contrast(.9)} }
button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.loading{color:var(--muted); font-size:13px}
.m-only{display:none}
@media (max-width:480px){ .m-only{display:inline} }
footer.foot{font-size:12px; color:var(--muted); margin-top:28px; border-top:1px solid var(--line); padding-top:10px}
footer.foot p{margin:4px 0}
.basemap-sat{filter:none}
.locbtn{width:34px; height:34px; display:grid; place-items:center; background:var(--panel); color:var(--ink); border:0; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.15); cursor:pointer; padding:0}
.locbtn svg{width:18px; height:18px}
.locbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:1000; background:var(--ink); color:var(--panel); font-size:13px; padding:7px 12px; border-radius:8px; max-width:calc(100% - 32px); box-shadow:0 4px 14px rgba(0,0,0,.25)}
.mapswitch{display:flex; background:var(--panel); border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mapswitch button{font:inherit; font-size:12.5px; border:0; padding:6px 10px; background:var(--panel); color:var(--ink); cursor:pointer}
.mapswitch button[aria-pressed="true"]{background:var(--accent); color:var(--panel)}
.takeaways{margin:14px 0 0; padding:12px 14px 12px 30px; background:var(--accent-soft); border-radius:8px; font-size:13.5px}
.takeaways li{margin:3px 0}
.takeaways .h{display:block; margin-left:-16px; font-size:12px; letter-spacing:.05em; color:var(--accent); font-weight:700; list-style:none}
dl.facts{display:grid; grid-template-columns:max-content 1fr; gap:5px 14px; margin:0; font-size:13.5px}
dl.facts dt{color:var(--muted); font-size:12.5px}
dl.facts dd{margin:0}
.spark{display:block; width:100%; height:auto; margin-top:6px; touch-action:pan-y}
.spark .hit{fill:transparent; cursor:crosshair}
.spark .hit:hover, .spark .hit.on{fill:var(--ink); fill-opacity:.07}
#tip{position:fixed; z-index:2000; pointer-events:none; background:var(--ink); color:var(--panel); font-size:12.5px; line-height:1.45; padding:6px 9px; border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:240px; white-space:nowrap}
#tip[hidden]{display:none}
.legend-inline{font-size:12px; color:var(--muted)}
.legend-inline i{display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:-1px}
.good{color:var(--safe)} .bad{color:var(--risk)}
.grade{display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; white-space:nowrap}
.flagchip{display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; background:var(--bg); color:var(--mid); border:1px solid var(--line); white-space:nowrap}
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px}
.kpis div{background:var(--bg); border-radius:8px; padding:9px 10px}
.kpis b{display:block; font-family:var(--f-num); font-size:20px; line-height:1.2}
.kpis small{color:var(--muted); font-size:12px}
tr.go{cursor:pointer} tr.go:hover td{background:var(--accent-soft)}
.panel-ctl{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0}
h3{font-size:14px; margin:16px 0 6px}
/* 접는 구역 */
details.sec{border-top:1px solid var(--line); margin-top:14px}
details.sec > summary{list-style:none; display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; padding:12px 0 4px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary h2{margin:0}
details.sec > summary::after{content:""; width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); margin:0 4px 4px 0; transition:transform .15s; flex:none}
details.sec[open] > summary::after{transform:rotate(-135deg); margin-bottom:-2px}
details.sec > summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
details.sec .sbody{padding-bottom:4px}
/* 주변 형편 요약 */
.kp b{font-size:18px}
.kp .grade{font-size:13px; vertical-align:2px}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.chips button{font:inherit; font-size:13px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:4px 11px; cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent); color:var(--panel); border-color:var(--accent)}
.mixbar{display:flex; height:10px; border-radius:3px; overflow:hidden; margin:6px 0 4px}
.mixbar i{display:block; height:100%}
.btn-go{font:inherit; font-size:13px; margin-top:8px; background:var(--accent); color:var(--panel); border:0; border-radius:999px; padding:6px 14px; cursor:pointer}
.regbox{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0 12px;line-height:1.55}
.reg-good{border-left-color:var(--t5)}.reg-bad{border-left-color:var(--t1)}.reg-mid{border-left-color:var(--t3)}
</style>
</head>
<body>
<header>
  <div class="brand">jari<span>이 자리 몇 년 버텼나</span></div>
  <div class="searchbox">
    <input id="q" type="search" autocomplete="off" placeholder="주소·상권·동 검색 (예: 망원동 415, 연남동, 송리단길)" aria-label="장소 검색">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="ctl">

      <optgroup label="미용"><option>미용실</option><option>네일</option><option>피부관리</option><option>메이크업</option><option>이발소</option></optgroup>
      <optgroup label="의료·건강"><option>의원</option><option>치과</option><option>한의원</option><option>약국</option><option>안경점</option></optgroup>
      <optgroup label="소매"><option>편의점</option><option>슈퍼마켓</option><option>전자담배</option></optgroup>

  </div>
</header>

  <div id="map" role="region" aria-label="지도"></div>

<script>
(function(){

const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlcXR6bnJhaWRlcnJldHZjd3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NjA1NDMsImV4cCI6MjExMDIzNjU0M30.ESREE1nA4P-ekMTKuvp12rW15dv3Pl4H8Zc3JCpZy8Y';
const H = {apikey: KEY, Authorization: 'Bearer ' + KEY};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (s, o) => o ? Math.round(100 * s / o) + '%' : '—';

async function rest(path, all){
  if(!all){ const r = await fetch(SB + '/rest/v1/' + path, {headers: H}); if(!r.ok) throw new Error(r.status); return r.json(); }
  let out = [], from = 0;
  for(;;){
    const r = await fetch(SB + '/rest/v1/' + path, {headers: {...H, Range: from + '-' + (from + 999)}});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(); out = out.concat(j);

}
async function rpc(fn, body){

let sheetState = 'half';
const sheetSizes = () => { const h = $('main').clientHeight; return {peek: Math.min(150, h * .28), half: Math.round(h * .5), full: h - 4}; };
function setSheet(st, px){
  const sh = $('sheet');
  if(!MOBILE()){ sh.style.height = ''; $('main').style.removeProperty('--shpx'); return; }
  const z = sheetSizes(), v = px ?? z[st];
  sh.style.height = v + 'px';

// 새 결과: 맨 위부터, 모바일에서 시트가 내려가 있으면 절반까지 올림
function toPanel(){ $('panel').scrollTop = 0; if(MOBILE() && sheetState === 'peek') setSheet('half'); }
(() => {
  const sh = $('sheet'), g = $('grab');
  let y0 = null, h0 = 0, moved = false;
  const start = y => { y0 = y; h0 = sh.getBoundingClientRect().height; moved = false; sh.classList.add('drag'); };
  const move = y => { if(y0 == null) return; const dy = y - y0; if(Math.abs(dy) > 5) moved = true; const z = sheetSizes(); setSheet(null, Math.max(z.peek * .8, Math.min(z.full, h0 - dy))); };
  const end = () => {
    if(y0 == null) return; sh.classList.remove('drag'); y0 = null;
    const z = sheetSizes(), h = sh.getBoundingClientRect().height;
    if(!moved) return setSheet(sheetState === 'full' ? 'half' : sheetState === 'half' ? 'full' : 'half');
    setSheet(Object.keys(z).sort((a, b) => Math.abs(z[a] - h) - Math.abs(z[b] - h))[0]);
  };
  g.addEventListener('pointerdown', e => { if(!MOBILE()) return; g.setPointerCapture(e.pointerId); start(e.clientY); });
  g.addEventListener('pointermove', e => move(e.clientY));
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  g.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setSheet(sheetState === 'full' ? 'peek' : sheetState === 'half' ? 'full' : 'half'); } });
  // 목록 맨 위에서 아래로 쓸어내리면 시트도 내려감
  const P = $('panel'); let ty = null;
  P.addEventListener('touchstart', e => { ty = P.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
  P.addEventListener('touchmove', e => {
    if(ty == null || !MOBILE()) return;
    const y = e.touches[0].clientY;
    if(y0 == null && y - ty > 14 && P.scrollTop <= 0) start(ty);
    if(y0 != null){ e.preventDefault(); move(y); }
  }, {passive:false});
  P.addEventListener('touchend', () => { ty = null; end(); });
  window.addEventListener('resize', () => setSheet(sheetState));
  setSheet('half');
})();

let jpN = 0;
function jsonp(url, ms = 8000){
  return new Promise((res, rej) => {
    const cb = '__vw' + (++jpN), s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('load')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}

const median = a => { if(!a.length) return null; const s = [...a].sort((x,y) => x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };

function roadGloss(s){

const JKEY_RE = /(\S+구)\s+(\S+동\d*가?)\s+(산\s*)?(\d+)(?:-(\d+))?/;
function toJkey(addr){ const m = JKEY_RE.exec(addr || ''); return m ? m[1] + '|' + m[2] + ' ' + m[4] + (m[5] && m[5] !== '0' ? '-' + m[5] : '') : null; }

async function landInfo(lat, lon, addr){
  if(!VWORLD_KEY) return null;
  let pnu = null, pt = [lat, lon], paddr = null;
  if(addr){
    try{
      const r = (await vwq('/req/address', {service:'address', request:'getcoord', version:'2.0', crs:'epsg:4326', type:'parcel', refine:'true', simple:'false', address:addr})).response;
      if(r.status === 'OK'){ pnu = r.refined.structure.level4LC; pt = [+r.result.point.y, +r.result.point.x]; paddr = r.refined.text; }
    }catch(e){}
  }
  if(!pnu){
    const f = vwFeat(await vwq('/req/data', {service:'data', request:'GetFeature', data:'LP_PA_CBND_BUBUN', geomFilter:`POINT(${lon} ${lat})`, crs:'EPSG:4326', geometry:'false', size:'1'}).catch(() => null));
    if(f[0]){ pnu = f[0].pnu; paddr = f[0].addr; }
  }
  if(!pnu) return null;
  const dLat = 150/111000, dLon = 150/88000;
  const [ch, pr, bl, nb] = await Promise.all([
    vwq('/ned/data/getLandCharacteristics', {pnu, numOfRows:'50'}).catch(() => null),
    vwq('/ned/data/getIndvdLandPriceAttr', {pnu, numOfRows:'100'}).catch(() => null),
    vwq('/req/data', {service:'data', request:'GetFeature', data:'LT_C_BLDGINFO', geomFilter:`POINT(${pt[1]} ${pt[0]})`, crs:'EPSG:4326', geometry:'false', size:'5'}).catch(() => null),
    vwq('/req/data', {service:'data', request:'GetFeature', data:'LP_PA_CBND_BUBUN', geomFilter:`BOX(${pt[1]-dLon},${pt[0]-dLat},${pt[1]+dLon},${pt[0]+dLat})`, crs:'EPSG:4326', geometry:'false', size:'1000'}).catch(() => null)
  ]);
  const c = arr(ch?.landCharacteristicss?.field).sort((a,b) => (b.stdrYear||'').localeCompare(a.stdrYear||'') || (b.lastUpdtDt||'').localeCompare(a.lastUpdtDt||''))[0] || null;
  const byY = new Map(); arr(pr?.indvdLandPrices?.field).forEach(x => { if(+x.pblntfPclnd > 0) byY.set(+x.stdrYear, +x.pblntfPclnd); });
  const prices = [...byY].map(([y,p]) => ({y, p})).sort((a,b) => a.y - b.y);
  const bld = vwFeat(bl).sort((a,b) => (+b.totalarea||0) - (+a.totalarea||0))[0] || null;
  const nf = vwFeat(nb).filter(x => /대$/.test(x.jibun || '') && +x.jiga > 0 && x.pnu !== pnu);
  const cnt = {}; nf.forEach(x => cnt[x.gosi_year] = (cnt[x.gosi_year] || 0) + 1);
  const nearYear = +(Object.entries(cnt).sort((a,b) => b[1] - a[1])[0] || [0])[0];   // 지적도 공시지가 기준 연도(보통 작년)
  const near = nf.filter(x => +x.gosi_year === nearYear).map(x => +x.jiga);
  return {pnu, addr: paddr, c, prices, bld, near, nearYear};
}
function landStats(L){
  if(!L) return {};
  const last = L.prices[L.prices.length - 1], by = y => L.prices.find(x => x.y === y);
  const p5 = last && by(last.y - 5), p10 = last && by(last.y - 10);
  const ref = by(L.nearYear);   // 주변 필지와 같은 해 값으로 비교
  const top = ref && L.near.length >= 15 ? Math.max(1, Math.round(100 * L.near.filter(x => x >= ref.p).length / L.near.length)) : null;
  const cagr10 = p10 ? Math.pow(last.p / p10.p, 1/10) - 1 : null;
  return {last, ch5: p5 ? last.p / p5.p - 1 : null, cagr10, top, nearMed: median(L.near)};
}
// 그래프 칸(점·막대)마다 투명한 영역을 깔고, 마우스를 올리거나 탭하면 숫자를 말풍선으로 보여 줌
function hitCols(xs, W, H, tips){
  return xs.map((x,i) => {
    const l = i ? (xs[i-1] + x) / 2 : 0, r = i < xs.length-1 ? (x + xs[i+1]) / 2 : W;
    return '<rect class="hit" x="'+l.toFixed(1)+'" y="0" width="'+(r-l).toFixed(1)+'" height="'+H+'" data-tip="'+esc(tips[i])+'"/>';
  }).join('');
}
const tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.hidden = true; tipEl.setAttribute('role', 'status'); document.body.appendChild(tipEl);
let tipOn = null;
function showTip(el, cx, cy){
  if(tipOn && tipOn !== el) tipOn.classList.remove('on');
  tipOn = el; el.classList.add('on');
  tipEl.innerHTML = esc(el.dataset.tip).replace(/\n/g, '<br>'); tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, cx - w / 2)) + 'px';
  tipEl.style.top = (cy - h - 14 < 8 ? cy + 18 : cy - h - 14) + 'px';
}
function hideTip(){ tipEl.hidden = true; if(tipOn){ tipOn.classList.remove('on'); tipOn = null; } }
document.addEventListener('pointermove', e => { const h = e.target.closest && e.target.closest('.hit'); if(h) showTip(h, e.clientX, e.clientY); else if(tipOn && e.pointerType === 'mouse') hideTip(); });
document.addEventListener('click', e => { const h = e.target.closest && e.target.closest('.hit'); if(h) showTip(h, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('scroll', hideTip, true);

function priceSpark(prices){
  const pts = prices.filter(x => x.y >= 2010); if(pts.length < 3) return '';
  const W = 360, H = 70, P = 4, max = Math.max(...pts.map(x => x.p)), min = Math.min(...pts.map(x => x.p));
  const X = i => P + i * (W - 2*P) / (pts.length - 1), Y = p => H - 14 - (max === min ? .5 : (p - min) / (max - min)) * (H - 22);
  const d = pts.map((x,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.p).toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="공시지가 추이 '+pts[0].y+'~'+pts[pts.length-1].y+'">' +
    '<path d="'+d+'" fill="none" stroke="'+css('--accent')+'" stroke-width="2"/>' +
    pts.map((x,i) => '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.p).toFixed(1)+'" r="2" fill="'+css('--accent')+'"/>').join('') +
    hitCols(pts.map((x,i) => X(i)), W, H, pts.map((x,i) => x.y + '년 공시지가\n평당 ' + won(x.p * PY) + ' (㎡당 ' + won(x.p) + ')' + (i ? '\n전년보다 ' + sgnPct(x.p / pts[i-1].p - 1) : ''))) +
    '<text x="'+P+'" y="'+(H-2)+'" font-size="10" fill="'+css('--muted')+'">'+pts[0].y+'</text>' +
    '<text x="'+(W-P)+'" y="'+(H-2)+'" font-size="10" text-anchor="end" fill="'+css('--muted')+'">'+pts[pts.length-1].y+'</text></svg>';
}
function landHtml(L){

    const bits = [];
    if(s.ch5 != null) bits.push('5년 전보다 <b class="num">'+(s.ch5 >= 0 ? '+' : '')+Math.round(s.ch5*100)+'%</b>');
    if(s.cagr10 != null) bits.push('10년 연평균 <b class="num">'+(s.cagr10*100).toFixed(1)+'%</b>');

    if(bits.length) h += '<p class="note" style="margin:4px 0 0">' + bits.join(' · ') + '</p>';

const G_NAME = {floor:'층', size:'면적', chain:'운영'};

  return h;
}

// ---------- 상권 흐름 (서울시 상권분석서비스 분기 자료)
const IX = {'다이나믹':'새 가게가 많이 들어오고 빨리 바뀌는 상권', '상권확장':'새 가게가 늘고 기존 가게도 버티는, 커지는 상권',
            '상권축소':'새로 연 가게가 빨리 닫는, 줄어드는 상권', '정체':'가게가 오래 머물고 변화가 적은 상권'};
const GRADE_C = {'뜨는 중':'--t5', '보합':'--muted', '식는 중':'--t1'};
const qlab = q => String(q).slice(2,4) + '.' + String(q).slice(4) + 'Q';
function qChart(pts, name, cv, fv){
  pts = pts.filter(x => x.v > 0); if(pts.length < 4) return '';
  const prevY = new Map(pts.map(x => [x.q, x.v]));
  const tips = pts.map(x => { const p = prevY.get(x.q - 10); return '20' + qlab(x.q).replace('.', '년 ').replace('Q', '분기') + '\n' + name + ' ' + fv(x.v) + (p ? '\n1년 전 같은 분기보다 ' + sgnPct(x.v / p - 1) : ''); });
  const W = 360, H = 90, P = 6, max = Math.max(...pts.map(x => x.v)), min = Math.min(...pts.map(x => x.v)) * .9;
  const X = i => P + i * (W - 2*P) / (pts.length - 1), Y = v => H - 16 - (v - min) / (max - min || 1) * (H - 26);
  const d = pts.map((x,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.v).toFixed(1)).join(' ');
  const dots = pts.map((x,i) => '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.v).toFixed(1)+'" r="2.2" fill="'+css(cv)+'"/>').join('');
  const labs = pts.map((x,i) => (i % 4 === 0 || i === pts.length-1) ? '<text x="'+X(i).toFixed(1)+'" y="'+(H-2)+'" font-size="10" text-anchor="middle" fill="'+css('--muted')+'">'+qlab(x.q)+'</text>' : '').join('');
  const last = pts[pts.length-1];
  return '<p class="note" style="margin:10px 0 0">'+name+' · 최근 분기 <b>'+fv(last.v)+'</b> <span class="note">(점에 마우스를 올리거나 누르면 분기별 숫자)</span></p><svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+name+' 분기 추이"><path d="'+d+'" fill="none" stroke="'+css(cv)+'" stroke-width="2"/>'+dots+labs+hitCols(pts.map((x,i) => X(i)), W, H, tips)+'</svg>';
}
function trendHtml(tr, sv){
  if(!tr || !tr.t) return '<p class="note">서울시 상권분석서비스 매출·유동인구 자료가 없는 상권입니다.</p>';
  const t = tr.t, sh = (a,b) => a && b ? a/b : null;
  const y1 = sh(t.y_now, t.s_now), y0 = sh(t.y_prev, t.s_prev);
  let h = '<p class="note" style="margin:0 0 6px">'+esc(trendLab())+' · '+qlab(t.q_last)+'까지</p>';
  h += '<p style="margin:0">' + (t.grade ? '<span class="grade" style="background:'+css(GRADE_C[t.grade])+'">'+esc(t.grade)+'</span> ' : '') +
       (t.score != null ? '<span class="note">서울 상권 중 상위 '+Math.max(1, Math.round((1 - t.score) * 100))+'%</span> ' : '<span class="note">비교할 자료가 부족합니다</span> ') +
       (t.flag ? '<span class="flagchip">'+esc(t.flag)+'</span>' : '') + '</p>';
  h += '<div class="kpis">' +
    '<div><small>매출 1년 변화</small><b>'+sgn(t.sales_yoy)+'</b><small>3년 '+sgn(t.sales_3y)+'</small></div>' +
    '<div><small>유동인구 1년 변화</small><b>'+sgn(t.flpop_yoy)+'</b><small>3년 '+sgn(t.f_3y ? t.f_now/t.f_3y - 1 : null)+'</small></div>' +
    '<div><small>영업 중 가게 수</small><b>'+fmt(t.n_now)+'곳</b><small>3년 전 '+fmt(t.n_3y)+'곳 ('+sgn(t.store_3y)+')</small></div>' +
    '<div><small>20·30대 매출 비중</small><b>'+(y1 != null ? Math.round(y1*100)+'%' : '—')+'</b><small>1년 전 '+(y0 != null ? Math.round(y0*100)+'%' : '—')+'</small></div></div>';
  if(t.ix_nm) h += '<p class="note" style="margin:8px 0 0">서울시 상권변화지표: <b>'+esc(t.ix_nm)+'</b> — '+esc(IX[t.ix_nm] || '')+'</p>';
  h += qChart(tr.sa.map(x => ({q:x.q, v:x.amt})), '추정매출', '--accent', won) +
       qChart(tr.aq.map(x => ({q:x.q, v:x.flpop})), '유동인구', '--mid', v => v >= 1e4 ? fmt(Math.round(v/1e4)) + '만 명' : fmt(Math.round(v)) + '명');
  h += '<p class="note">매출은 서울시가 카드 결제로 추정한 값이라 물가 상승분이 섞여 있습니다. 계절 차이가 있어 같은 분기끼리(1년 전과) 비교합니다.</p>';
  return h;
}

// ---------- 한눈에 보기: 숫자에서 문장 뽑기 (표본이 충분할 때만)
function takeaways({bld, near, d, L, turn, where, tr}){
  const out = [], r = (s,o) => o ? s/o : null, P = x => Math.round(x*100) + '%';
  if(tr && tr.score != null){
    const g = tr.grade === '뜨는 중' ? '<b class="good">뜨는 중</b>' : tr.grade === '식는 중' ? '<b class="bad">식는 중</b>' : '<b>보합</b>';
    out.push('최근 1년 매출 <b>'+sgn(tr.sales_yoy)+'</b>, 유동인구 <b>'+sgn(tr.flpop_yoy)+'</b>, 3년 사이 가게 수 <b>'+sgn(tr.store_3y)+'</b>로 서울 상권 중 '+g+'(상위 '+Math.max(1, Math.round((1 - tr.score)*100))+'%)입니다.');
    if(tr.sales_yoy != null && tr.store_3y != null && tr.sales_yoy > .05 && tr.store_3y < -.05) out.push('가게는 줄었는데 매출은 늘어, 남은 가게 한 곳당 매출이 커졌을 가능성이 있습니다.');
    if(tr.sales_yoy != null && tr.store_3y != null && tr.sales_yoy < -.05 && tr.store_3y > .1) out.push('가게는 늘었는데 매출은 줄어, <b class="bad">한 곳당 몫이 작아지는</b> 경쟁 과열 신호일 수 있습니다.');
  }
  if(tr && tr.flag === '개업 거의 없음') out.push('3년 사이 가게가 크게 줄었는데 새로 연 가게가 거의 없습니다. 재개발·철거 계획이 있는지 먼저 확인하세요.');
  const noun = x => esc(x.g === 'chain' ? (x.k === '프랜차이즈' ? '프랜차이즈 가게' : x.k) : x.k + ' 가게');
  if(bld && near && bld.o3 >= 5 && near.o3 >= 30){
    const a = r(bld.s3, bld.o3), b = r(near.s3, near.o3);
    if(Math.abs(a - b) >= .08) out.push('이 건물에서 문 연 가게의 3년 생존율은 <b>'+P(a)+'</b>로 반경 300m 평균('+P(b)+')보다 <b class="'+(a > b ? 'good' : 'bad')+'">'+(a > b ? '높습니다' : '낮습니다')+'</b>.');
    else out.push('이 건물의 3년 생존율('+P(a)+')은 반경 300m 평균('+P(b)+')과 비슷합니다.');
  }
  if(d){
    for(const g of ['floor','size','chain']){
      const rs = d.groups.filter(x => x.g === g && x.o3 >= 10).map(x => ({...x, v: x.s3/x.o3})).sort((a,b) => b.v - a.v);
      if(rs.length >= 2 && rs[0].v - rs[rs.length-1].v >= .08)
        out.push(esc(where)+(state.svc === '전체' ? '에서는' : '의 '+esc(SVC_LABEL())+' 중에서는')+' <b>'+noun(rs[0])+'</b>('+P(rs[0].v)+')가 <b>'+noun(rs[rs.length-1])+'</b>('+P(rs[rs.length-1].v)+')보다 3년을 잘 버텼습니다.');
    }
    const cy = new Date().getFullYear(), last3 = (d.years || []).filter(y => y.y >= cy-3 && y.y < cy);
    const o = last3.reduce((s,y) => s + y.opens, 0), c = last3.reduce((s,y) => s + y.closes, 0);
    if(o + c >= 20){
      const span = (cy-3)+'~'+(cy-1)+'년';
      if(c > o * 1.15) out.push(span+' 폐업 <b>'+c+'</b>건이 개업 '+o+'건보다 많아, 가게 수가 <b class="bad">줄고 있는</b> 곳입니다.');
      else if(o > c * 1.15) out.push(span+' 개업 <b>'+o+'</b>건이 폐업 '+c+'건보다 많아, 가게가 <b class="good">늘고 있는</b> 곳입니다. 경쟁도 함께 늘어납니다.');
      else out.push(span+' 개업 '+o+'건, 폐업 '+c+'건으로 가게 수가 큰 변화 없이 <b>손바뀜</b>만 일어나는 곳입니다.');
    }
    if(state.svc !== '전체'){
      const on = d.open_now || [], tot = on.reduce((s,x) => s + x.n, 0), m = on.find(x => x.svc === state.svc);
      if(tot >= 20) out.push('지금 '+esc(where)+'에 '+esc(SVC_LABEL())+' <b>'+(m ? m.n : 0)+'곳</b>이 영업 중입니다(모든 업종의 '+Math.round(100*(m ? m.n : 0)/tot)+'%).');
    }
  }
  if(turn && turn.closes >= 2 && turn.gapMed != null && !(bld && bld.n_open > 3))
    out.push('이 건물에서 가게가 문을 닫은 뒤 다음 가게가 들어오기까지 <b>중앙값 '+(turn.gapMed < 60 ? Math.round(turn.gapMed)+'일' : (turn.gapMed/30.4).toFixed(0)+'개월')+'</b> 걸렸습니다'+(turn.unfilled ? ' (그 뒤로 아직 가게가 안 들어온 경우 '+turn.unfilled+'번)' : '')+'.');
  const s = landStats(L);
  if(s.top != null) out.push('공시지가가 반경 150m 대지 중 <b>상위 '+s.top+'%</b>입니다' + (s.top <= 25 ? '. 주변보다 임대료가 높을 가능성이 큽니다.' : s.top >= 75 ? '. 주변보다 땅값이 낮은 편입니다.' : '.'));
  if(s.ch5 != null) out.push('땅값(공시지가)은 5년 동안 <b>'+(s.ch5 >= 0 ? '+' : '')+Math.round(s.ch5*100)+'%</b> 움직였습니다.');
  if(!out.length) return '';
  return '<ul class="takeaways"><li class="h">한눈에 보기</li>' + out.map(x => '<li>'+x+'</li>').join('') + '</ul>';
}
// 건물 임차 회전: 폐업 뒤 다음 가게가 들어오기까지 걸린 기간
function turnover(hist){
  const closes = hist.filter(x => x.close_date && x.life_days != null), gaps = []; let unfilled = 0;
  for(const c of closes){
    const nxt = hist.filter(x => x.open_date >= c.close_date).map(x => x.open_date).sort()[0];
    if(nxt) gaps.push((new Date(nxt) - new Date(c.close_date)) / 864e5); else unfilled++;
  }
  return {closes: closes.length, gapMed: median(gaps), unfilled, lifeMed: median(closes.map(x => x.life_days))};
}
let panelTok = 0;
// ---------- 접는 구역: 사용자가 열고 닫은 상태는 구역별로 기억

// 주변 외국인 민박(도시민박·한옥체험): 요약 칸 + 접는 구역, '민박 지도'로 넘어가는 단추

  if(st.new1 || st.close1) lines.push('최근 1년 새로 등록 <b>'+fmt(st.new1)+'곳</b> · 폐업 '+fmt(st.close1)+'곳');
  if(st.o3 >= 5) lines.push('3년이 지난 민박 '+fmt(st.o3)+'곳 중 <b>'+pct(st.s3, st.o3)+'</b>가 아직 영업 중');
  el.innerHTML = '<p style="margin:0">'+lines.join('<br>')+'</p>' + (st.dong ? '<button type="button" class="btn-go" data-dong="'+esc(st.dong)+'">민박 지도에서 이 동 보기</button>' : '');
  const b = el.querySelector('[data-dong]'); if(b) b.onclick = () => goStay(b.dataset.dong);

function inRing(x, y, ring){ let c = false; for(let i = 0, j = ring.length - 1; i < ring.length; j = i++){ const [xi, yi] = ring[i], [xj, yj] = ring[j]; if((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
const areaAt = (lat, lon) => AREAS.find(a => a.geom && a.geom.some(r => inRing(lon, lat, r)));

async function cmpData(it){
  const sv = trendSvc(), o = {it};
  if(it.k === 'a'){
    const a = AREAS.find(x => x.code === it.id); if(!a) throw new Error('상권 없음');
    Object.assign(o, {lat:a.lat, lon:a.lon, area:a, title:a.name, sub:a.gu + ' · ' + a.kind + ' 상권'});
    o.own = (await rest('area_stats?select=*&code=eq.' + a.code + '&svc=eq.' + encodeURIComponent(state.svc)))[0] || null;
    o.ownLab = '상권 전체';
  } else if(it.k === 'b'){
    const [b] = await rest('building?select=*&jkey=eq.' + encodeURIComponent(it.id)); if(!b) throw new Error('건물 없음');
    Object.assign(o, {lat:b.lat, lon:b.lon, b, title:b.label, sub:b.gu + ' · 건물', addr:'서울특별시 ' + b.gu + ' ' + b.label});
    o.area = AREAS.find(x => x.code === b.area_code) || areaAt(b.lat, b.lon);
    o.own = b; o.ownLab = '이 건물(모든 업종)';
  } else {
    const [lat, lon] = it.id.split(',').map(Number);
    Object.assign(o, {lat, lon, title:it.t, sub:'위치 · 반경 300m', addr:it.addr});
    o.area = areaAt(lat, lon);
  }
  const [near, det, tr, L] = await Promise.all([
    rpc('near_stats', {p_lat:o.lat, p_lon:o.lon, p_r:300}).catch(() => []),
    rpc('place_detail', {p_lat:o.lat, p_lon:o.lon, p_r:300, p_svc:state.svc}).catch(() => null),
    o.area ? rest('area_trend?select=*&code=eq.' + o.area.code + '&svc=eq.' + encodeURIComponent(sv)).then(r => r[0] || null).catch(() => null) : null,
    it.k === 'a' ? null : landInfo(o.lat, o.lon, o.addr).catch(() => null)
  ]);
  o.near = near.find(r => r.svc === state.svc) || (state.svc === '전체' ? null : {o1:0, s1:0, o3:0, s3:0});

// ---------- 검색: 우리 DB(건물·상권) + 브이월드(아무 주소·장소)
let sTimer = null, lastHits = [], sTok = 0;
async function vwSearch(q){
  if(!VWORLD_KEY) return [];
  const go = p => vwq('/req/search', {service:'search', request:'search', version:'2.0', crs:'EPSG:4326', size:'5', page:'1', query:q, ...p})
    .then(d => d?.response?.status === 'OK' ? d.response.result.items : []).catch(() => []);
  const [road, parcel, place] = await Promise.all([go({type:'address', category:'road'}), go({type:'address', category:'parcel'}), go({type:'place'})]);
  const out = [], seen = new Set();
  const add = (kind, label, sub, it) => {
    const pa = it.address?.parcel || '', lat = +it.point.y, lon = +it.point.x;
    if(!/서울/.test((it.address?.road || '') + pa + label + sub)) return;
    const k = kind === 'place' ? label + '|' + Math.round(lat*1e4) + Math.round(lon*1e4) : label; if(seen.has(k)) return; seen.add(k);
    if(kind === 'place' && seen.has(it.address?.road || '-')) return;   // 같은 주소에 있는 회사·가게 이름은 주소 결과와 중복
    out.push({kind, label, sub, lat, lon, addr: pa ? (/^서울/.test(pa) ? pa : '서울특별시 ' + pa) : null});
  };
  road.forEach(it => add('addr', it.address.road, it.address.parcel ? '지번 ' + it.address.parcel : '', it));
  parcel.forEach(it => add('addr', it.address.parcel, it.address.road || '', it));
  place.forEach(it => add('place', it.title, (it.address.road || it.address.parcel || '') + (it.category ? ' · ' + it.category.split('>').pop().trim() : ''), it));
  return out.slice(0, 8);
}
const CHIP = {area:'상권', building:'건물', addr:'주소', place:'장소'};
function renderHits(hits){
  const box = $('results');
  if(!hits.length){ box.innerHTML = '<button type="button" disabled>맞는 곳이 없습니다. "망원동 415"처럼 동과 번지, 도로명 주소, 상권·장소 이름으로 찾아 보세요.</button>'; box.hidden = false; return; }
  box.innerHTML = hits.map((h,i) => '<button type="button" data-i="'+i+'"><span class="chip">'+CHIP[h.kind]+'</span>'+esc(h.label)+'<small>'+esc(h.sub || '')+(h.n ? ' · 가게 '+h.n+'곳' : '')+'</small></button>').join('');
  box.hidden = false;
}
async function doSearch(q, pickFirst){
  track('search');
  q = q.trim(); if(q.length < 2){ $('results').hidden = true; return; }
  const tok = ++sTok;
  const vwP = vwSearch(q);
  const db = await rpc('search_places', {q}).catch(() => []);
  if(tok !== sTok) return;
  lastHits = db;
  if(db.length) renderHits(db);
  if(pickFirst && db.length) return pick(db[0]);
  const vw = await vwP;
  if(tok !== sTok) return;
  lastHits = db.concat(vw);
  renderHits(lastHits);
  if(pickFirst && lastHits.length) pick(lastHits[0]);
}
async function pick(h){
  $('results').hidden = true; $('q').blur();
  if(state.mode === 'stay'){
    let ll = h.kind === 'area' ? AREAS.find(a => a.code === h.id) : h.kind === 'building' ? (await rest('building?select=lat,lon&jkey=eq.' + encodeURIComponent(h.id)).catch(() => []))[0] : h;
    if(h.kind !== 'area' && ll && ll.lat){ fly(ll.lat, ll.lon, Math.max(map.getZoom(), 17)); return showHouse(ll.lat, ll.lon, h.label, h.addr); }
    await loadDongs(); const d = ll && ll.lat ? dongAt(ll.lat, ll.lon) : null;
    if(d) return showDong(d.cd);
  }
  if(h.kind === 'area') return showArea(h.id);
  if(h.kind === 'building') return showBuilding(h.id);
  // 주소·장소: 그 지번에 가게 기록이 있으면 건물 화면, 없으면 위치 화면
  const jk = toJkey(h.addr);
  if(jk){ const [b] = await rest('building?select=jkey&jkey=eq.' + encodeURIComponent(jk)).catch(() => []); if(b) return showBuilding(b.jkey); }
  fly(h.lat, h.lon, Math.max(map.getZoom(), 17));
  showPoint(h.lat, h.lon, h.label, h.addr);
}

    return a && a.n >= 3 ? '<b class="num">' + man(a.v) + '</b><br><span class="note">보증금 ' + man(dp && dp.v) + ' · ' + a.n + '건</span>' : '<span class="note">계약 적음</span>'; };
  const chg = t => { const a = wavg(rowsOf(t, '전체', 0), 'rent'), b = wavg(rowsOf(t, '전체', 1), 'rent'); return a && b && a.n >= 10 && b.n >= 10 ? sgnPct(a.v / b.v - 1) : '—'; };
  const lab = {연립다세대: '연립·다세대', 단독다가구: '단독·다가구', 오피스텔: '오피스텔 <span class="flagchip">도시민박 등록 대상 아님</span>'};
  const bjds = bd.sort((a, b) => b.share - a.share).map(b => esc(b.bjd) + (b.share < .95 ? '(' + Math.round(b.share * 100) + '%)' : '')).join(', ');
  const ref = wavg([...rowsOf('연립다세대', '투룸급', 0), ...rowsOf('단독다가구', '투룸급', 0)], 'rent');
  el.innerHTML = '<p class="note" style="margin:0 0 6px">최근 1년 월세 계약 중앙값 · 법정동 ' + bjds + '</p>' +
    '<div class="tblwrap"><table><thead><tr><th></th><th class="r">원룸급<br><span class="note">30㎡ 미만</span></th><th class="r">투룸급<br><span class="note">30~60㎡</span></th><th class="r">1년 변화</th></tr></thead><tbody>' +
    ['연립다세대', '단독다가구', '오피스텔'].map(t => '<tr><td>' + lab[t] + '</td><td class="r">' + cell(t, '원룸급') + '</td><td class="r">' + cell(t, '투룸급') + '</td><td class="r num">' + chg(t) + '</td></tr>').join('') +
    '</tbody></table></div>' +
    (ref && ref.n >= 3 ? '<h3>손익 따져 보기</h3><p style="margin:0">1박 <input id="nightly" type="number" inputmode="numeric" min="10000" step="5000" placeholder="예: 80000" style="width:110px;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"> 원이면</p><p id="calc" class="note" style="margin:6px 0 0" data-rent="' + ref.v.toFixed(1) + '">투룸급(연립·다세대·단독·다가구) 월세 중앙값 <b>' + man(ref.v) + '</b> 기준으로 계산합니다.</p>' : '');
  const inp = $('nightly');
  if(inp){
    try{ const v = localStorage.getItem('jari.nightly'); if(v) inp.value = v; }catch(e){}
    const calc = () => { const c = $('calc'), rent = +c.dataset.rent * 1e4, p = +inp.value;
      if(!p || p < 1000){ c.innerHTML = '투룸급(연립·다세대·단독·다가구) 월세 중앙값 <b>' + man(rent / 1e4) + '</b> 기준으로 계산합니다.'; return; }
      try{ localStorage.setItem('jari.nightly', String(p)); }catch(e){}
      const n = rent / p, occ = n / 30.4;
      c.innerHTML = '월세 <b>' + man(rent / 1e4) + '</b>를 1박 요금으로만 메우려면 한 달 <b>' + n.toFixed(1) + '박</b>(예약률 <b class="' + (occ > .6 ? 'bad' : occ < .35 ? 'good' : '') + '">' + Math.round(occ * 100) + '%</b>)이 필요합니다. 플랫폼 수수료·청소·공과금은 빠진 계산입니다.'; };
    inp.addEventListener('input', calc); calc();
  }
}


// ---------- 컨트롤
function reshow(){
  const s = state.sel; if(!s) return;
  if(s.kind === 'cmp') return showCompare();
  if(s.kind === 'area') showArea(s.code); else if(s.kind === 'building') showBuilding(s.jkey); else if(s.kind === 'point') showPoint(s.lat, s.lon, s.title, s.addr); else if(s.kind === 'dong') showDong(s.cd);
}
$('svc').addEventListener('change', async e => {
  track('svc');
  state.svc = e.target.value; await (state.mode === 'trend' ? loadTrend() : loadStats()); drawAreas(); drawLegend();
  if(state.svc !== '전체') try{ const r = JSON.parse(localStorage.getItem('jari.svcs') || '[]').filter(v => v !== state.svc); localStorage.setItem('jari.svcs', JSON.stringify([state.svc, ...r].slice(0, 4))); }catch(err){}
  if(state.sel) reshow(); else showHome();
});
// 보기 전환. quiet = 패널은 부른 쪽이 그림
async function setMode(m, quiet){
  if(m === 'trend') track('trend'); if(m === 'stay') track('stay');
  const was = state.mode; state.mode = m;
  document.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === m)));
  $('yrs').style.display = m === 'surv' ? '' : 'none';
  $('svc').style.display = m === 'stay' ? 'none' : '';
  if(m === 'stay') await loadDongs(); else if(m === 'trend') await loadTrend(); else await loadStats();
  drawAreas(); drawLegend(); drawBuildings();
  if(quiet) return;
  if(state.sel && state.sel.kind === 'cmp' && m !== 'stay') showCompare();
  else if(state.sel && state.sel.kind === 'area' && m !== 'stay' && was !== 'stay') return;
  else if(m === 'stay' && state.sel && (state.sel.kind === 'area' || state.sel.kind === 'building' || state.sel.kind === 'point')){
    const s = state.sel, ll = s.kind === 'area' ? AREAS.find(a => a.code === s.code) : s.kind === 'point' ? s : (await rest('building?select=lat,lon&jkey=eq.' + encodeURIComponent(s.jkey)).catch(() => []))[0];
    const d = ll && ll.lat ? dongAt(ll.lat, ll.lon) : null;
    if(d) showDong(d.cd); else showHome();
  }
  else showHome();
}
document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
document.querySelectorAll('#yrs button').forEach(b => b.addEventListener('click', () => {
  state.y = +b.dataset.y;
  document.querySelectorAll('#yrs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  drawAreas(); drawLegend(); paintBuildings();
}));

(async () => {
  track('view');
  const link = readLink();
  if(link && link.s && [...$('svc').options].some(o => o.value === link.s)){ state.svc = link.s; $('svc').value = link.s; }
  drawLegend();
  try{
    await Promise.all([loadAreas(), loadStats()]);
    drawAreas();
    const fromLink = cmpLoad(); cmpBar();
    if(fromLink && CMP.length >= 2) await showCompare();
    else if(link && link.k === 'a' && AREAS.some(x => x.code === link.id)){ await showHome(); await showArea(link.id); }
    else if(link && link.k === 'b'){ await showHome(); await showBuilding(link.id); }
    else if(link && link.k === 'd'){ await setMode('stay', true); await showDong(link.id); }
    else if(link && link.k === 'h' && /^[\d.]+,[\d.]+$/.test(link.id)){ const [la, lo] = link.id.split(',').map(Number); await setMode('stay', true); fly(la, lo, 18); await showHouse(la, lo); }
    else await showHome();
  } catch(err){
    $('panel').innerHTML = '<p>데이터를 불러오지 못했습니다('+esc(err.message)+'). 잠시 뒤 새로고침해 주세요.</p>';
  }
})();
})();
</script>
