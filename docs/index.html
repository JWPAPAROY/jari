<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jari · 이 자리 몇 년 버텼나</title>
<meta name="description" content="서울 음식점·카페 인허가 기록으로 본 건물·상권별 1·2·3년 생존율과 업종별 차이">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* 레이아웃: 위 검색줄 · 왼쪽 지도 · 오른쪽 결과 패널(모바일은 지도 아래). 인허가 대장 같은 차분한 톤 */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#18232b; --muted:#5d6b75; --line:#d9e0e4;
  --accent:#1f5f7a; --accent-soft:#e2eef3;
  --risk:#b4342b; --risk-soft:#f7e3e1; --safe:#2c7a4b; --safe-soft:#e1f1e7; --mid:#8a6d1d;
  --c1:#c0392b; --c2:#e07b4f; --c3:#e9c46a; --c4:#7fb77e; --c5:#2c7a4b; --cna:#b8c2c8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11181d; --panel:#182229; --ink:#e4ebef; --muted:#93a3ad; --line:#2a3842;
  --accent:#6fb3cf; --accent-soft:#1d3440; --risk:#ec7a70; --risk-soft:#3a2120; --safe:#6cc58f; --safe-soft:#1b3326; --mid:#d6b45a; --cna:#4a5862; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 var(--f-body)}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
header{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right)); background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:1000}
.brand{font-weight:700; font-size:18px; letter-spacing:-.01em; white-space:nowrap}
.brand span{color:var(--muted); font-weight:400; font-size:13px; margin-left:6px}
.searchbox{position:relative; flex:1 1 280px; min-width:0}
.searchbox input{width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px}
.results{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:60vh; overflow:auto}
.results button{display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:9px 12px; font:inherit; color:var(--ink); cursor:pointer}
.results button:hover, .results button:focus-visible{background:var(--accent-soft); outline:none}
.results small{display:block; color:var(--muted); font-size:12px}
.chip{font-size:11px; padding:1px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent); margin-right:6px}
.ctl{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
select{font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 8px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{font:inherit; font-size:13px; background:var(--bg); color:var(--ink); border:0; padding:7px 10px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel)}
main{display:grid; grid-template-columns:minmax(0,1fr) 420px; height:calc(100% - 58px)}
#map{height:100%; min-height:300px; background:var(--bg)}
aside{overflow:auto; background:var(--panel); border-left:1px solid var(--line); padding:18px max(18px,env(safe-area-inset-right)) 40px 18px}
@media (max-width:860px){
  header{gap:8px; padding-top:max(8px,env(safe-area-inset-top)); padding-bottom:8px; position:sticky; top:0}
  .brand span{display:none}
  .searchbox{order:3; flex-basis:100%}
  .searchbox input{font-size:16px; padding:10px 12px}
  .ctl{margin-left:auto}
  select{font-size:14px; padding:6px}
  .seg button{padding:6px 9px}
  main{display:block; height:auto}
  #map{height:46vh; min-height:260px}
  aside{border-left:0; border-top:1px solid var(--line); padding:16px max(16px,env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  h1{font-size:19px}
  .surv b{font-size:22px}
  .legend{font-size:11px; padding:6px 8px; line-height:1.35}
  .legend .note{display:none}
  .legend.closed .rows{display:none}
  .results{max-height:55vh}
}
@media (max-width:480px){
  .col-bar{display:none}
  th,td{padding:6px 4px}
  .surv{gap:6px}
  .surv div{padding:8px}
}
#toMap{display:none}
@media (max-width:860px){
  #toMap{position:fixed; right:max(14px,env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:1100; font:inherit; font-size:14px; font-weight:500;
    background:var(--accent); color:var(--panel); border:0; border-radius:999px; padding:10px 16px; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer}
  #toMap.show{display:block}
}
h1{font-size:20px; line-height:1.3; margin:0; text-wrap:balance}
h2{font-size:15px; margin:22px 0 8px}
.sub{color:var(--muted); font-size:13px; margin:2px 0 0}
.label{font-size:12px; letter-spacing:.05em; color:var(--muted)}
.surv{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.surv div{background:var(--bg); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:2px}
.surv b{font-family:var(--f-num); font-size:26px; line-height:1.1}
.surv small{color:var(--muted); font-size:12px}
.warn{font-size:12.5px; color:var(--mid); margin-top:8px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-weight:500; color:var(--muted); font-size:12px}
td.r,th.r{text-align:right}
tr.thin td{opacity:.45}
.bar{height:8px; border-radius:2px; background:var(--bg); position:relative; min-width:50px}
.bar i{position:absolute; inset:0 auto 0 0; border-radius:2px}
.tag{font-size:12px; padding:1px 7px; border-radius:4px; white-space:nowrap}
.tag.dead{background:var(--risk-soft); color:var(--risk)} .tag.live{background:var(--safe-soft); color:var(--safe)} .tag.old{background:var(--bg); color:var(--muted)}
.note{font-size:12.5px; color:var(--muted)}
.legend{background:var(--panel); color:var(--ink); padding:8px 10px; border-radius:8px; font-size:12px; line-height:1.5; box-shadow:0 2px 8px rgba(0,0,0,.15)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.hint{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.hint button{font:inherit; font-size:13px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer}
.tblwrap{overflow-x:auto}
.leaflet-container{font-family:var(--f-body)}
.basemap{filter:grayscale(.85) contrast(.95) brightness(1.04)}
@media (prefers-color-scheme: dark){ .basemap{filter:grayscale(1) invert(.9) brightness(.85) contrast(.9)} }
button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.loading{color:var(--muted); font-size:13px}
.m-only{display:none}
@media (max-width:480px){ .m-only{display:inline} }
footer.foot{font-size:12px; color:var(--muted); margin-top:28px; border-top:1px solid var(--line); padding-top:10px}
footer.foot p{margin:4px 0}
</style>
</head>
<body>
<header>
  <div class="brand">jari<span>이 자리 몇 년 버텼나</span></div>
  <div class="searchbox">
    <input id="q" type="search" autocomplete="off" placeholder="주소·상권·동 검색 (예: 망원동 415, 연남동, 송리단길)" aria-label="장소 검색">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="ctl">
    <select id="svc" aria-label="업종">
      <option value="전체">모든 업종</option>
      <option>한식</option><option>커피·음료</option><option>호프·주점</option><option>분식</option><option>양식</option>
      <option>일식</option><option>중식</option><option>치킨</option><option>제과</option><option>패스트푸드</option><option value="기타">기타(분류 어려움)</option>
    </select>
    <div class="seg" role="group" aria-label="기준 기간">
      <button type="button" data-y="1" aria-pressed="false">1년</button>
      <button type="button" data-y="2" aria-pressed="false">2년</button>
      <button type="button" data-y="3" aria-pressed="true">3년</button>
    </div>
  </div>
</header>
<main>
  <div id="map" role="region" aria-label="지도"></div>
  <aside id="panel" aria-live="polite"><p class="loading">불러오는 중…</p></aside>
</main>
<button type="button" id="toMap">지도 보기</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const SB = 'https://weqtznraiderretvcwzp.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlcXR6bnJhaWRlcnJldHZjd3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NjA1NDMsImV4cCI6MjExMDIzNjU0M30.ESREE1nA4P-ekMTKuvp12rW15dv3Pl4H8Zc3JCpZy8Y';
const H = {apikey: KEY, Authorization: 'Bearer ' + KEY};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (s, o) => o ? Math.round(100 * s / o) + '%' : '—';
const fmt = n => (n ?? 0).toLocaleString('ko-KR');

async function rest(path, all){
  if(!all){ const r = await fetch(SB + '/rest/v1/' + path, {headers: H}); if(!r.ok) throw new Error(r.status); return r.json(); }
  let out = [], from = 0;
  for(;;){
    const r = await fetch(SB + '/rest/v1/' + path, {headers: {...H, Range: from + '-' + (from + 999)}});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json(); out = out.concat(j);
    if(j.length < 1000) return out; from += 1000;
  }
}
async function rpc(fn, body){
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, {method:'POST', headers:{...H, 'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
  if(!r.ok) throw new Error(r.status); return r.json();
}

const state = {svc:'전체', y:3, sel:null};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// 생존율 → 색 (연차별 구간)
const BINS = {1:[.72,.79,.85,.9], 2:[.55,.64,.72,.8], 3:[.45,.55,.63,.72]};
function color(rate){
  if(rate == null) return css('--cna');
  const b = BINS[state.y];
  return css(rate < b[0] ? '--c1' : rate < b[1] ? '--c2' : rate < b[2] ? '--c3' : rate < b[3] ? '--c4' : '--c5');
}
const MIN_AREA = 15, MIN_BLD = 3;
const MOBILE = () => window.matchMedia('(max-width:860px)').matches;
// 모바일: 결과를 띄우면 패널로 내려가고, '지도 보기'로 다시 올라감
function toPanel(){ if(MOBILE()) $('panel').scrollIntoView({behavior:'smooth', block:'start'}); }
$('toMap').addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', () => $('toMap').classList.toggle('show', MOBILE() && window.scrollY > window.innerHeight * .35), {passive:true});

// ---------- 지도
const map = L.map('map', {zoomControl:true, preferCanvas:true}).setView([37.5565, 126.99], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, className:'basemap',
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const areaLayer = L.layerGroup().addTo(map);
const bldLayer = L.layerGroup().addTo(map);
let marker = null;

const legend = L.control({position:'bottomleft'});
legend.onAdd = () => { const d = L.DomUtil.create('div','legend' + (MOBILE() ? ' closed' : '')); d.id = 'legend'; L.DomEvent.disableClickPropagation(d); d.addEventListener('click', () => d.classList.toggle('closed')); return d; };
legend.addTo(map);
function drawLegend(){
  const b = BINS[state.y], p = x => Math.round(x*100);
  $('legend').innerHTML = '<b>'+state.y+'년 생존율</b> · '+esc(state.svc==='전체'?'모든 업종':state.svc)+'<div class="rows">'+
    [['--c5','≥'+p(b[3])+'%'],['--c4',p(b[2])+'~'+p(b[3])+'%'],['--c3',p(b[1])+'~'+p(b[2])+'%'],['--c2',p(b[0])+'~'+p(b[1])+'%'],['--c1','<'+p(b[0])+'%'],['--cna','표본 부족']]
    .map(([c,t]) => '<i style="background:'+css(c)+'"></i>'+t).join('<br>') + '<br><span class="note">확대하면 건물별 점이 보입니다</span></div>';
}

let AREAS = [], STATS = new Map();
async function loadAreas(){
  AREAS = await rest('area?select=code,name,kind,gu,geom,lat,lon', true);
}
async function loadStats(){
  const rows = await rest('area_stats?select=code,o1,s1,o2,s2,o3,s3,med_days&svc=eq.' + encodeURIComponent(state.svc), true);
  STATS = new Map(rows.map(r => [r.code, r]));
}
function rateOf(r){ if(!r) return null; const o = r['o'+state.y], s = r['s'+state.y]; return o >= MIN_AREA ? s/o : null; }
function drawAreas(){
  areaLayer.clearLayers();
  for(const a of AREAS){
    if(!a.geom) continue;
    const st = STATS.get(a.code), rate = rateOf(st);
    const poly = L.polygon(a.geom.map(r => r.map(([x,y]) => [y,x])), {
      color: color(rate), weight: 1, fillColor: color(rate), fillOpacity: map.getZoom() >= 16 ? .12 : .45
    });
    poly.on('click', e => { L.DomEvent.stopPropagation(e); showArea(a.code); });
    poly.bindTooltip(esc(a.name) + (rate != null ? ' · ' + Math.round(rate*100) + '%' : ''), {sticky:true});
    poly.addTo(areaLayer);
  }
}
let bldTimer = null;
async function drawBuildings(){
  bldLayer.clearLayers();
  if(map.getZoom() < 16) return;
  const b = map.getBounds();
  const rows = await rpc('buildings_in_view', {min_lat:b.getSouth(), min_lon:b.getWest(), max_lat:b.getNorth(), max_lon:b.getEast()});
  for(const r of rows){
    const o = r['o3'], s = r['s3'];
    const rate = o >= MIN_BLD ? s/o : null;
    const c = rate == null
      ? L.circleMarker([r.lat, r.lon], {radius: 3, stroke:false, fillColor: color3(null), fillOpacity:.55})
      : L.circleMarker([r.lat, r.lon], {radius: 4 + Math.min(8, Math.sqrt(r.n)*1.6), color:'#fff', weight:1, fillColor: color3(rate), fillOpacity:.92});
    c.on('click', e => { L.DomEvent.stopPropagation(e); showBuilding(r.jkey); });
    c.bindTooltip(esc(r.jkey.split('|')[1]) + ' · 가게 ' + r.n + '곳' + (rate!=null ? ' · 3년 생존 ' + Math.round(rate*100) + '%' : ''));
    c.addTo(bldLayer);
  }
}
function color3(rate){ const y = state.y; state.y = 3; const c = color(rate); state.y = y; return c; }
map.on('moveend', () => { clearTimeout(bldTimer); bldTimer = setTimeout(drawBuildings, 250); });
map.on('zoomend', () => areaLayer.eachLayer(l => l.setStyle({fillOpacity: map.getZoom() >= 16 ? .12 : .45})));
map.on('click', e => { if(map.getZoom() >= 15) showPoint(e.latlng.lat, e.latlng.lng); });

// ---------- 패널 공통
function survBlock(r, title){
  const cells = [1,2,3].map(y => {
    const o = r['o'+y], s = r['s'+y];
    return '<div><span class="label">'+y+'년 생존</span><b>'+pct(s,o)+'</b><small>'+(o ? fmt(s)+' / '+fmt(o)+'곳' : '관찰 대상 없음')+'</small></div>';
  }).join('');
  return (title ? '<h2>'+title+'</h2>' : '') + '<div class="surv">'+cells+'</div>';
}
function svcTable(rows, minO){
  const list = rows.filter(r => r.svc !== '전체' && r.o3 > 0)
    .map(r => ({...r, r3: r.o3 ? r.s3/r.o3 : 0})).sort((a,b) => (b.o3>=minO) - (a.o3>=minO) || b.r3 - a.r3);
  if(!list.length) return '<p class="note">업종별로 나눌 만큼 기록이 없습니다.</p>';
  return '<div class="tblwrap"><table><thead><tr><th>업종</th><th class="r">1년</th><th class="r">2년</th><th class="r">3년</th><th class="col-bar" style="width:70px"></th><th class="r">3년 표본</th></tr></thead><tbody>' +
    list.map(r => '<tr class="'+(r.o3 < minO ? 'thin' : '')+'"><td>'+esc(r.svc === '기타' ? '기타(분류 어려움)' : r.svc)+'</td><td class="r num">'+pct(r.s1,r.o1)+'</td><td class="r num">'+pct(r.s2,r.o2)+'</td><td class="r num"><b>'+pct(r.s3,r.o3)+'</b></td>'+
      '<td class="col-bar"><div class="bar"><i style="width:'+(r.r3*100).toFixed(0)+'%;background:'+color3(r.r3)+'"></i></div></td><td class="r num note">'+fmt(r.o3)+'</td></tr>').join('') +
    '</tbody></table></div><p class="note">흐린 줄은 3년 관찰 가게가 '+minO+'곳 미만이라 참고만 하세요.</p>';
}
function lifeTag(x){
  if(!x.close_date) return '<span class="tag live">영업 중</span>';
  const d = x.life_days; if(d == null) return '<span class="tag old">명의변경</span>';
  const t = d < 365 ? Math.round(d/30.4)+'개월' : (d/365).toFixed(1)+'년';
  return '<span class="tag '+(d < 1095 ? 'dead' : 'old')+'">'+t+'</span>';
}
const ym = d => d ? d.slice(0,7).replace('-','.') : '';
const FOOT = '<footer class="foot"><p><b>생존율</b> 2016년 이후 문을 연 음식점·카페 중, 개업 후 1·2·3년이 지난 가게가 그 시점에 아직 영업 중이었던 비율. 같은 자리·같은 상호가 60일 안에 다시 인허가를 받으면 명의변경으로 보고 영업이 이어진 것으로 셌습니다.</p><p><b>자료</b> 행정안전부 LOCALDATA 일반·휴게음식점 인허가, 서울시 상권분석서비스 상권 영역. 매주 월요일 갱신. 개별 가게의 앞날을 예측하지 않습니다. 같은 조건에서도 결과는 운영에 따라 크게 갈립니다.</p><p><a href="table.html">조건별 폐업률 표(송파·마포 시제품)</a></p></footer>';

function setMarker(lat, lon){ if(marker) marker.remove(); marker = L.circleMarker([lat,lon], {radius:10, color:css('--accent'), weight:3, fill:false}).addTo(map); }

// ---------- 처음 화면
async function showHome(){
  const rows = await rpc('seoul_stats', {});
  const all = rows.find(r => r.svc === '전체') || {};
  $('panel').innerHTML = '<h1>서울 음식점·카페, 몇 년 버텼나</h1><p class="sub">2016년 이후 문을 연 가게 기준 · 주소나 상권을 검색하거나 지도를 눌러 보세요</p>' +
    survBlock(all, '') +
    '<div class="hint">' + ['망원동 415','연남동','송리단길','성수동2가','을지로3가'].map(t => '<button type="button" data-q="'+t+'">'+t+'</button>').join('') + '</div>' +
    '<h2>업종별로 보면</h2>' + svcTable(rows, 100) + FOOT;
  $('panel').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('q').value = b.dataset.q; doSearch(b.dataset.q, true); });
}

// ---------- 상권
async function showArea(code){
  state.sel = {kind:'area', code};
  const a = AREAS.find(x => x.code === code); if(!a) return;
  $('panel').innerHTML = '<p class="loading">불러오는 중…</p>';
  const rows = await rest('area_stats?select=*&code=eq.' + code);
  const all = rows.find(r => r.svc === '전체') || {};
  const best = rows.filter(r => r.svc !== '전체' && r.o3 >= 10).sort((x,y) => y.s3/y.o3 - x.s3/x.o3)[0];
  $('panel').innerHTML = '<div class="label">'+esc(a.gu)+' · '+esc(a.kind)+'</div><h1>'+esc(a.name)+'</h1>' +
    (all.med_days ? '<p class="sub">문 닫은 가게의 영업 기간 중앙값 <b class="num">'+(all.med_days/365).toFixed(1)+'년</b></p>' : '') +
    survBlock(all, '이 상권 전체') +
    (best ? '<p class="note" style="margin-top:10px">이 상권에서 3년을 가장 잘 버틴 업종은 <b>'+esc(best.svc)+'</b>('+pct(best.s3,best.o3)+', '+best.o3+'곳 중)입니다.</p>' : '') +
    '<h2>업종별 생존율</h2>' + svcTable(rows, 10) + FOOT;
  if(a.lat) map.flyTo([a.lat, a.lon], Math.max(map.getZoom(), 15), {duration:.6});
  toPanel();
}

// ---------- 건물
async function showBuilding(jkey){
  state.sel = {kind:'building', jkey};
  $('panel').innerHTML = '<p class="loading">불러오는 중…</p>';
  const [b] = await rest('building?select=*&jkey=eq.' + encodeURIComponent(jkey));
  if(!b){ $('panel').innerHTML = '<p>기록이 없습니다.</p>'; return; }
  const [hist, near, area] = await Promise.all([
    rest('license?select=name,biz_type,svc,open_date,close_date,life_days,floor,size_m2,status&jkey=eq.' + encodeURIComponent(jkey) + '&order=open_date.desc&limit=200'),
    rpc('near_stats', {p_lat:b.lat, p_lon:b.lon, p_r:300}),
    b.area_code ? rest('area_stats?select=*&code=eq.' + b.area_code + '&svc=eq.' + encodeURIComponent('전체')) : Promise.resolve([])
  ]);
  const a = AREAS.find(x => x.code === b.area_code);
  const nearAll = near.find(r => r.svc === '전체') || {};
  const cmp = (lab, r) => '<tr><td>'+lab+'</td>' + [1,2,3].map(y => '<td class="r num">'+pct(r['s'+y], r['o'+y])+'</td>').join('') + '<td class="r num note">'+fmt(r.o3)+'</td></tr>';
  const recent = hist.filter(x => x.close_date && x.close_date >= new Date(Date.now()-3*365*864e5).toISOString().slice(0,10)).length;
  $('panel').innerHTML = '<div class="label">'+esc(b.gu)+(a ? ' · '+esc(a.name) : '')+'</div><h1>'+esc(b.label)+'</h1>' +
    (b.road ? '<p class="sub">'+esc(b.road)+'</p>' : '') +
    survBlock(b, '이 건물에서 문 연 가게') +
    (b.o1 < 5 ? '<p class="warn">이 건물은 기록이 적어 숫자가 크게 흔들립니다. 아래 주변·상권 수치를 함께 보세요.</p>' : '') +
    '<p class="note" style="margin-top:8px">지금 영업 중 <b>'+b.n_open+'</b>곳 · 최근 3년 사이 폐업 <b>'+recent+'</b>건</p>' +
    '<h2>주변과 비교</h2><div class="tblwrap"><table><thead><tr><th></th><th class="r">1년</th><th class="r">2년</th><th class="r">3년</th><th class="r">3년 표본</th></tr></thead><tbody>' +
      cmp('이 건물', b) + cmp('반경 300m', nearAll) + (area[0] ? cmp('상권 전체', area[0]) : '') + '</tbody></table></div>' +
    '<h2>이 근처(300m)에서 오래 버틴 업종</h2>' + svcTable(near, 10) +
    '<h2>이 건물을 거쳐 간 가게</h2><div class="tblwrap"><table><thead><tr><th>상호</th><th class="col-bar">업종</th><th>개업</th><th>폐업</th><th class="r">영업</th></tr></thead><tbody>' +
      hist.map(x => '<tr><td>'+esc(x.name)+'<br><span class="note">'+esc(x.floor||'')+(x.size_m2 ? ' · '+Math.round(x.size_m2/3.3058)+'평' : '')+'<span class="m-only"> · '+esc(x.svc || x.biz_type || '')+'</span></span></td><td class="note col-bar">'+esc(x.svc || x.biz_type || '')+'</td><td class="num">'+ym(x.open_date)+'</td><td class="num">'+(ym(x.close_date) || '—')+'</td><td class="r">'+lifeTag(x)+'</td></tr>').join('') +
    '</tbody></table></div>' + FOOT;
  setMarker(b.lat, b.lon);
  map.flyTo([b.lat, b.lon], Math.max(map.getZoom(), 17), {duration:.6});
  toPanel();
}

// ---------- 지도 아무 데나 누르면 반경 통계
async function showPoint(lat, lon){
  state.sel = {kind:'point'};
  setMarker(lat, lon);
  $('panel').innerHTML = '<p class="loading">불러오는 중…</p>';
  const near = await rpc('near_stats', {p_lat:lat, p_lon:lon, p_r:300});
  const all = near.find(r => r.svc === '전체') || {};
  $('panel').innerHTML = '<div class="label">고른 위치 반경 300m</div><h1>이 근처 가게들</h1>' + survBlock(all, '') +
    '<h2>업종별 생존율</h2>' + svcTable(near, 10) + '<p class="note">점(건물)을 누르면 그 건물의 이력을 볼 수 있습니다.</p>' + FOOT;
  toPanel();
}

// ---------- 검색
let sTimer = null, lastHits = [];
async function doSearch(q, pickFirst){
  q = q.trim(); if(q.length < 2){ $('results').hidden = true; return; }
  const hits = await rpc('search_places', {q}); lastHits = hits;
  const box = $('results');
  if(!hits.length){ box.innerHTML = '<button type="button" disabled>맞는 곳이 없습니다. "망원동 415"처럼 동과 번지, 또는 상권 이름으로 찾아 보세요.</button>'; box.hidden = false; return; }
  box.innerHTML = hits.map((h,i) => '<button type="button" data-i="'+i+'"><span class="chip">'+(h.kind==='area'?'상권':'건물')+'</span>'+esc(h.label)+'<small>'+esc(h.sub || '')+(h.n ? ' · 가게 '+h.n+'곳' : '')+'</small></button>').join('');
  box.hidden = false;
  if(pickFirst){ pick(hits[0]); }
}
function pick(h){
  $('results').hidden = true; $('q').blur();
  if(h.kind === 'area') showArea(h.id); else showBuilding(h.id);
}
$('q').addEventListener('input', e => { clearTimeout(sTimer); sTimer = setTimeout(() => doSearch(e.target.value).catch(()=>{}), 250); });
$('q').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(lastHits.length && !$('results').hidden) pick(lastHits[0]); else doSearch(e.target.value, true); } if(e.key === 'Escape') $('results').hidden = true; });
$('results').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if(b) pick(lastHits[+b.dataset.i]); });
document.addEventListener('click', e => { if(!e.target.closest('.searchbox')) $('results').hidden = true; });

// ---------- 컨트롤
$('svc').addEventListener('change', async e => { state.svc = e.target.value; await loadStats(); drawAreas(); drawLegend(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  state.y = +b.dataset.y;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  drawAreas(); drawLegend();
}));

(async () => {
  drawLegend();
  try{
    await Promise.all([loadAreas(), loadStats()]);
    drawAreas();
    await showHome();
  } catch(err){
    $('panel').innerHTML = '<p>데이터를 불러오지 못했습니다('+esc(err.message)+'). 잠시 뒤 새로고침해 주세요.</p>';
  }
})();
})();
</script>
</body>
